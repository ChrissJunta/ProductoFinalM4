{% extends 'base.html' %}
{% block title %}Inicio{% endblock %}
{% block content %}
<section class="card border-0 shadow-sm p-3 p-md-4" aria-labelledby="home-title">
  <div class="card-body">
    <p class="text-secondary small mb-2">{{ user_role }}</p>
    <h1 id="home-title" class="h3">Hola, {{ user.get_full_name|default:user.username }}</h1>
    <p class="text-secondary">Tu sesión está activa. Puedes enviar una solicitud de atención.</p>
    <a class="btn btn-primary" href="{% url 'helpdesk:ticket_create' %}">Nueva solicitud</a>
  </div>
</section>
{% endblock %}
