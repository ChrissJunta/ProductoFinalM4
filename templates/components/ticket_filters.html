<form method="get" action="{{ filter_action }}" class="card card-body border-0 shadow-sm mb-4 mesa-filters" aria-label="Filtrar tickets">
  {% if tab %}<input type="hidden" name="tab" value="{{ tab }}">{% endif %}
  <div class="row g-3">
    <div class="col-12 col-md-8"><label for="filter-q" class="form-label">Buscar por asunto o código</label><input id="filter-q" class="form-control" type="search" name="q" value="{{ filters.q|default:'' }}"></div>
    <div class="col-12 col-md-4"><label for="filter-sort" class="form-label">Ordenar</label><select id="filter-sort" class="form-select" name="sort">{% for value, label in sort_choices %}<option value="{{ value }}"{% if filters.sort == value %} selected{% endif %}>{{ label }}</option>{% endfor %}</select></div>

    <div class="col-12 col-md-4"><label for="filter-status" class="form-label">Estado</label><select id="filter-status" class="form-select" name="status"><option value="">Todos</option>{% for value, label in status_choices %}<option value="{{ value }}"{% if filters.status == value %} selected{% endif %}>{{ label }}</option>{% endfor %}<option value="FINISHED"{% if filters.status == 'FINISHED' %} selected{% endif %}>Finalizados</option></select></div>
    <div class="col-12 col-md-4"><label for="filter-from" class="form-label">Creada desde</label><input id="filter-from" class="form-control" type="date" name="date_from" value="{{ filters.date_from|default:'' }}"></div>
    <div class="col-12 col-md-4"><label for="filter-to" class="form-label">Creada hasta</label><input id="filter-to" class="form-control" type="date" name="date_to" value="{{ filters.date_to|default:'' }}"></div>
    {% if user_role != 'Usuario' %}
    <div class="col-12"><details class="mesa-filter-advanced"{% if filters.priority or filters.category or filters.area or filters.sla or filters.assignee %} open{% endif %}><summary>Más filtros: prioridad, categoría, área y SLA{% if tab %}, responsable{% endif %}</summary><div class="row g-3">
    <div class="col-12 col-md-3"><label for="filter-priority" class="form-label">Prioridad</label><select id="filter-priority" class="form-select" name="priority"><option value="">Todas</option>{% for value, label in priority_choices %}<option value="{{ value }}"{% if filters.priority == value %} selected{% endif %}>{{ label }}</option>{% endfor %}</select></div>
    <div class="col-12 col-md-3"><label for="filter-category" class="form-label">Categoría</label><select id="filter-category" class="form-select" name="category"><option value="">Todas</option>{% for category in categories %}<option value="{{ category.pk }}"{% if filters.category|stringformat:'s' == category.pk|stringformat:'s' %} selected{% endif %}>{{ category.name }}</option>{% endfor %}</select></div>
    <div class="col-12 col-md-3"><label for="filter-area" class="form-label">Área</label><select id="filter-area" class="form-select" name="area"><option value="">Todas</option>{% for area in areas %}<option value="{{ area.pk }}"{% if filters.area|stringformat:'s' == area.pk|stringformat:'s' %} selected{% endif %}>{{ area.name }}</option>{% endfor %}</select></div>
    <div class="col-12 col-md-3"><label for="filter-sla" class="form-label">SLA</label><select id="filter-sla" class="form-select" name="sla"><option value="">Todos</option><option value="WARNING"{% if filters.sla == 'WARNING' %} selected{% endif %}>Por vencer</option><option value="BREACHED"{% if filters.sla == 'BREACHED' %} selected{% endif %}>Vencido</option></select></div>
    {% if tab %}<div class="col-12 col-md-4"><label for="filter-assignee" class="form-label">Responsable</label><select id="filter-assignee" class="form-select" name="assignee"><option value="">Todos</option><option value="me"{% if filters.assignee == 'me' %} selected{% endif %}>Asignados a mí</option><option value="none"{% if filters.assignee == 'none' %} selected{% endif %}>Sin responsable</option>{% for assignee in assignees %}<option value="{{ assignee.pk }}"{% if filters.assignee|stringformat:'s' == assignee.pk|stringformat:'s' %} selected{% endif %}>{{ assignee.get_full_name|default:assignee.username }}</option>{% endfor %}</select></div>{% endif %}
    </div></details></div>
    {% endif %}
    <div class="col-12 d-flex flex-wrap gap-2"><button type="submit" class="btn btn-primary">Aplicar filtros</button><a class="btn btn-outline-secondary" href="{{ filter_action }}{% if tab %}?tab={{ tab|urlencode }}{% endif %}">Limpiar</a></div>
  </div>
</form>
