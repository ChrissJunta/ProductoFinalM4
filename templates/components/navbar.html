<header class="bg-white border-bottom">
  <nav class="container py-3 d-flex flex-wrap align-items-center gap-3" aria-label="Navegación principal">
    <a class="fw-bold fs-5 text-decoration-none text-dark me-auto" href="{% url 'accounts:role_redirect' %}">Mesa de Ayuda</a>
    {% if user.is_authenticated %}
      <a class="nav-link" href="{% url 'accounts:role_redirect' %}">Inicio</a>
      {% if user_role == 'Supervisor' %}<a class="nav-link" href="{% url 'helpdesk:alert_list' %}">Alertas</a>{% endif %}
      <span class="small text-secondary account-label">{{ user.get_full_name|default:user.username }}{% if user_role %} · {{ user_role }}{% endif %}</span>
      <form method="post" action="{% url 'accounts:logout' %}">
        {% csrf_token %}
        <button type="submit" class="btn btn-outline-secondary btn-sm">Cerrar sesión</button>
      </form>
    {% else %}
      <span class="small text-secondary">Portal de atención</span>
    {% endif %}
  </nav>
</header>
