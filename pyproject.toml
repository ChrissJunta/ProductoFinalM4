[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
testpaths = ["apps"]
addopts = "--strict-markers"

[tool.coverage.run]
source = ["apps", "config"]
omit = ["*/migrations/*", "*/tests/*", "config/asgi.py", "config/wsgi.py", "config/settings/dev.py"]

[tool.ruff]
line-length = 100
target-version = "py312"
# La documentación (.md) no se formatea: sus bloques de código son ilustrativos.
extend-exclude = ["*/migrations/*", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ"]
